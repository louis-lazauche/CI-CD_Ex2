name: CI Pipeline (dev)

on:
  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # BACKEND
      - name: Install backend
        working-directory: backend
        run: npm install

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Audit backend
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Test backend
        working-directory: backend
        run: npm test

      # FRONTEND
      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Audit frontend
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Test frontend
        working-directory: frontend
        run: npm test

      # Docker build test
      - name: Build Docker images
        run: docker compose build
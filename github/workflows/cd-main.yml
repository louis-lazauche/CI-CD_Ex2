name: CD Pipeline (main)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Create backend .env
        run: echo "${{ secrets.BACKEND_ENV }}" > backend/.env

      - name: Create frontend .env
        run: echo "${{ secrets.FRONTEND_ENV }}" > frontend/.env

      - name: Build images
        run: docker compose build

      - name: Tag backend image
        run: docker tag backend-image ${{ secrets.DOCKER_USERNAME }}/backend:latest

      - name: Tag frontend image
        run: docker tag frontend-image ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      - name: Push backend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest